  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

0%,transparent);margin-left:4px\">Admin<\u002Fdiv>\n      <button class=\"btn btn-icon btn-secondary\" style=\"margin-left:auto\" sc-camel-on-click=\"{{ toggleTheme }}\" aria-label=\"Toggle theme\"><ov-icon name=\"{{ themeIcon }}\" size=\"16\"><\u002Fov-icon><\u002Fbutton>\n    <\u002Fdiv>\n    <div style=\"flex:1;display:flex;flex-direction:column;justify-content:center;max-width:380px;width:100%;padding:48px 0\">\n      <sc-if value=\"{{ authLogin }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--color-accent)\">Sign in<\u002Fdiv>\n        <h2 style=\"margin:6px 0 6px;font-size:32px\">Welcome back<\u002Fh2>\n        <p style=\"color:color-mix(in srgb,var(--color-text) 62%,transparent);margin:0 0 28px\">Manage projects, inventory, tours and leads for the OVDC website.<\u002Fp>\n        <form sc-camel-on-submit=\"{{ signIn }}\" style=\"display:flex;flex-direction:column;gap:16px\">\n          <div class=\"field\"><label>Work email<\u002Flabel><input class=\"input\" type=\"email\" value=\"{{ email }}\" sc-camel-on-change=\"{{ onEmail }}\"><\u002Fdiv>\n          <div class=\"field\">\n            <div style=\"display:flex;justify-content:space-between;align-items:baseline\"><label style=\"font-size:12px;margin-bottom:5px;color:color-mix(in srgb,var(--color-text) 70%,transparent)\">Password<\u002Flabel><a href=\"#\" sc-camel-on-click=\"{{ goForgot }}\" style=\"font-size:12px\">Forgot password?<\u002Fa><\u002Fdiv>\n            <div style=\"position:relative\"><input class=\"input\" type=\"{{ pwType }}\" value=\"{{ password }}\" sc-camel-on-change=\"{{ onPassword }}\" placeholder=\"Enter your password\" style=\"padding-right:40px\"><button type=\"button\" class=\"btn btn-icon\" sc-camel-on-click=\"{{ togglePw }}\" style=\"position:absolute;right:0;top:0;height:36px\" aria-label=\"Show password\"><ov-icon name=\"{{ pwIcon }}\" size=\"16\"><\u002Fov-icon><\u002Fbutton><\u002Fdiv>\n            <sc-if value=\"{{ loginError }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"display:flex;gap:6px;align-items:center;font-size:12px;color:var(--color-accent-700);margin-top:6px\"><ov-icon name=\"circle-alert\" size=\"14\"><\u002Fov-icon>{{ loginError }}<\u002Fdiv><\u002Fsc-if>\n          <\u002Fdiv>\n          <label style=\"display:flex;gap:8px;align-items:center;font-size:13px;cursor:pointer\"><input type=\"checkbox\" checked=\"\" style=\"accent-color:var(--color-accent);width:15px;height:15px;margin:0\">Keep me signed in for 30 days<\u002Flabel>\n          <button class=\"btn btn-primary\" type=\"submit\" style=\"justify-content:space-between;height:44px;font-size:15px;padding:0 16px\">{{ signInLabel }}<ov-icon name=\"arrow-right\" size=\"18\"><\u002Fov-icon><\u002Fbutton>\n        <\u002Fform>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ authForgot }}\" hint-placeholder-val=\"{{ false }}\">\n        <button class=\"btn btn-ghost\" sc-camel-on-click=\"{{ goLogin }}\" style=\"align-self:flex-start;padding-left:0;margin-bottom:20px\"><ov-icon name=\"arrow-left\" size=\"16\"><\u002Fov-icon>Back to sign in<\u002Fbutton>\n        <h2 style=\"margin:0 0 6px;font-size:32px\">Reset password<\u002Fh2>\n        <p style=\"color:color-mix(in srgb,var(--color-text) 62%,transparent);margin:0 0 28px\">Enter the email on your OVDC account and we will send a reset link valid for 30 minutes.<\u002Fp>\n        <div style=\"display:flex;flex-direction:column;gap:16px\">\n          <div class=\"field\"><label>Work email<\u002Flabel><input class=\"input\" type=\"email\" value=\"{{ email }}\" sc-camel-on-change=\"{{ onEmail }}\"><\u002Fdiv>\n          <button class=\"btn btn-primary\" sc-camel-on-click=\"{{ sendReset }}\" style=\"justify-content:space-between;height:44px;font-size:15px;padding:0 16px\">Send reset link<ov-icon name=\"send\" size=\"16\"><\u002Fov-icon><\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ authSent }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"width:44px;height:44px;background:var(--color-accent-100);color:var(--color-accent-700);display:grid;place-items:center;margin-bottom:20px\"><ov-icon name=\"mail-check\" size=\"22\"><\u002Fov-icon><\u002Fdiv>\n        <h2 style=\"margin:0 0 6px;font-size:32px\">Check your inbox<\u002Fh2>\n        <p style=\"color:color-mix(in srgb,var(--color-text) 62%,transparent);margin:0 0 28px\">We sent a reset link to <strong style=\"color:var(--color-text)\">{{ email }}<\u002Fstrong>. It expires in 30 minutes.<\u002Fp>\n        <div style=\"display:flex;gap:8px\"><button class=\"btn btn-primary\" sc-camel-on-click=\"{{ goLogin }}\">Back to sign in<\u002Fbutton><button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ resend }}\">Resend email<\u002Fbutton><\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n    <div style=\"font-size:12px;color:color-mix(in srgb,var(--color-text) 55%,transparent);display:flex;gap:16px\"><span>© 2026 OVDC Developers<\u002Fspan><span>v4.2.0<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"flex:1 1 440px;background:var(--ov-panel);color:var(--ov-panel-ink);display:flex;flex-direction:column;justify-content:space-between;padding:40px;min-height:420px;background-image:linear-gradient(90deg,rgba(196,160,90,.22) 1px,transparent 1px);background-size:25% 100%\">\n    <div style=\"display:flex;justify-content:space-between;font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:600\"><span>CMS<\u002Fspan><span>CRM<\u002Fspan><span>360° Tours<\u002Fspan><\u002Fdiv>\n    <div>\n      <div style=\"font-weight:800;font-size:clamp(88px,13vw,180px);line-height:.85;letter-spacing:-.05em\">OVDC<\u002Fdiv>\n      <div style=\"height:2px;background:var(--color-accent);margin:24px 0 16px\"><\u002Fdiv>\n      <div style=\"font-weight:800;font-size:26px;line-height:1.15;max-width:420px\">Every project, unit, tour and enquiry in one console.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ showDesktop }}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"display:flex;height:100vh;overflow:hidden\">\n  <aside style=\"width:{{ sideW }};flex:none;display:flex;flex-direction:column;border-right:2px solid var(--color-divider);background:var(--color-bg)\">\n    <div style=\"height:56px;display:flex;align-items:center;gap:10px;padding:0 18px;border-bottom:2px solid var(--color-divider);flex:none\">\n      <div style=\"width:20px;height:20px;background:var(--color-accent);flex:none\"><\u002Fdiv>\n      <sc-if value=\"{{ expanded }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"font-weight:800;font-size:17px\">OVDC<\u002Fdiv><div class=\"tag tag-neutral\" style=\"margin-left:auto\">Admin<\u002Fdiv><\u002Fsc-if>\n    <\u002Fdiv>\n    <nav style=\"flex:1;overflow:auto;padding:10px 10px 16px;display:flex;flex-direction:column;gap:14px\">\n      <sc-for list=\"{{ navGroups }}\" as=\"g\" hint-placeholder-count=\"5\">\n        <div style=\"display:flex;flex-direction:column;gap:1px\">\n          <sc-if value=\"{{ expanded }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:color-mix(in srgb,var(--color-text) 50%,transparent);padding:4px 10px 6px\">{{ g.label }}<\u002Fdiv><\u002Fsc-if>\n          <sc-for list=\"{{ g.items }}\" as=\"it\" hint-placeholder-count=\"2\">\n            <button sc-camel-on-click=\"{{ it.go }}\" title=\"{{ it.label }}\" style=\"display:flex;align-items:center;gap:10px;width:100%;border:0;cursor:pointer;font:inherit;font-size:13.5px;text-align:left;padding:8px 10px;background:{{ it.bg }};color:{{ it.fg }};font-weight:{{ it.fw }}\" style-hover=\"background:color-mix(in srgb,var(--color-text) 7%,transparent)\">\n              <ov-icon name=\"{{ it.icon }}\" size=\"17\"><\u002Fov-icon>\n              <sc-if value=\"{{ expanded }}\" hint-placeholder-val=\"{{ true }}\"><span style=\"flex:1\">{{ it.label }}<\u002Fspan><sc-if value=\"{{ it.badg v style=\"position:relative;width:min(300px,30vw)\"><span style=\"position:absolute;left:10px;top:10px;color:color-mix(in srgb,var(--color-text) 50%,transparent)\"><ov-icon name=\"search\" size=\"16\"><\u002Fov-icon><\u002Fspan><input class=\"input\" placeholder=\"Search leads, units, projects…\" style=\"padding-left:34px;padding-right:44px\"><span style=\"position:absolute;right:8px;top:8px;font-size:11px;border:1px solid var(--color-divider);padding:1px 5px;color:color-mix(in srgb,var(--color-text) 55%,transparent)\">⌘K<\u002Fspan><\u002Fdiv>\n      <button class=\"btn btn-icon btn-secondary\" sc-camel-on-click=\"{{ toggleDevice }}\" title=\"Mobile preview\" aria-label=\"Mobile preview\"><ov-icon name=\"smartphone\" size=\"16\"><\u002Fov-icon><\u002Fbutton>\n      <button class=\"btn btn-icon btn-secondary\" sc-camel-on-click=\"{{ toggleTheme }}\" title=\"Toggle dark mode\" aria-label=\"Toggle theme\"><ov-icon name=\"{{ themeIcon }}\" size=\"16\"><\u002Fov-icon><\u002Fbutton>\n      <div style=\"position:relative\">\n        <button class=\"btn btn-icon btn-secondary\" sc-camel-on-click=\"{{ toggleNotif }}\" aria-label=\"Notifications\" style=\"position:relative\"><ov-icon name=\"bell\" size=\"16\"><\u002Fov-icon><span style=\"position:absolute;top:6px;right:7px;width:7px;height:7px;background:var(--color-accent)\"><\u002Fspan><\u002Fbutton>\n        <sc-if value=\"{{ notifOpen }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"position:absolute;right:0;top:44px;width:340px;background:var(--color-surface);box-shadow:var(--shadow-lg);z-index:40\">\n            <div style=\"display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:2px solid var(--color-divider)\"><strong style=\"font-size:13px\">Notifications<\u002Fstrong><button class=\"btn btn-ghost\" style=\"font-size:12px\" sc-camel-on-click=\"{{ markRead }}\">Mark all read<\u002Fbutton><\u002Fdiv>\n            <sc-for list=\"{{ notifs }}\" as=\"n\" hint-placeholder-count=\"3\">\n              <div sc-camel-on-click=\"{{ n.go }}\" style=\"display:flex;gap:10px;padding:12px 14px;border-bottom:1px solid var(--color-divider);cursor:pointer\" style-hover=\"background:color-mix(in srgb,var(--color-text) 5%,transparent)\">\n                <span style=\"color:var(--color-accent);margin-top:2px\"><ov-icon name=\"{{ n.icon }}\" size=\"16\"><\u002Fov-icon><\u002Fspan>\n                <div style=\"flex:1;font-size:13px;line-height:1.4\"><div>{{ n.text }}<\u002Fdiv><div style=\"font-size:11.5px;color:color-mix(in srgb,var(--color-text) 55%,transparent);margin-top:2px\">{{ n.time }}<\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fheader>\n    <main style=\"flex:1;min-height:0;overflow:auto;position:relative\">\n      <sc-if value=\"{{ s.dashboard }}\" hint-placeholder-val=\"{{ true }}\"><dc-import name=\"OvdcDashboard\" toast=\"{{ toast }}\" confirm=\"{{ confirm }}\" go=\"{{ go }}\" mobile=\"{{ false }}\" hint-size=\"100%,900px\"><\u002Fdc-import><\u002Fsc-if>\n      <sc-if value=\"{{ s.projects }}\" hint-placeholder-val=\"{{ false }}\"><dc-import name=\"OvdcProjects\" toast=\"{{ toast }}\" confirm=\"{{ confirm }}\" go=\"{{ go }}\" hint-size=\"100%,900px\"><\u002Fdc-import><\u002Fsc-if>\n      <sc-if value=\"{{ s.units }}\" hint-placeholder-val=\"{{ false }}\"><dc-import name=\"OvdcUnits\" toast=\"{{ toast }}\" confirm=\"{{ confirm }}\" go=\"{{ go }}\" hint-size=\"100%,900px\"><\u002Fdc-import><\u002Fsc-if>\n      <sc-if value=\"{{ s.tours }}\" hint-placeholder-val=\"{{ false }}\"><dc-import name=\"OvdcTours\" toast=\"{{ toast }}\" confirm=\"{{ confirm }}\" go=\"{{ go }}\" hint-size=\"100%,100%\"><\u002Fdc-import><\u002Fsc-if>\n      <sc-if value=\"{{ s.floorplans }}\" hint-placeholder-val=\"{{ false }}\"><dc-import name=\"OvdcFloorPlans\" toast=\"{{ toast }}\" confirm=\"{{ confirm }}\" go=\"{{ go }}\" hint-size=\"100%,900px\"><\u002Fdc-import><\u002Fsc-if>\n      <sc-if value=\"{{ s.media }}\" hint-placeholder-val=\"{{ false }}\"><dc-import name=\"OvdcMedia\" toast=\"{{ toast }}\" confirm=\"{{ confirm }}\" go=\"{{ go }}\" hint-size=\"100%,100%\"><\u002Fdc-import><\u002Fsc-if>\n      <sc-if value=\"{{ s.leads }}\" hint-placeholder-val=\"{{ false }}\"><dc-import name=\"OvdcLeads\" toast=\"{{ toast }}\" confirm=\"{{ confirm }}\" go=\"{{ go }}\" mobile=\"{{ false }}\" hint-size=\"100%,900px\"><\u002Fdc-import><\u002Fsc-if>\n      <sc-if value=\"{{ s.visits }}\" hint-placeholder-val=\"{{ false }}\"><dc-import name=\"OvdcVisits\" toast=\"{{ toast }}\" confirm=\"{{ confirm }}\" go=\"{{ go }}\" hint-size=\"100%,900px\"><\u002Fdc-import><\u002Fsc-if>\n      <sc-if value=\"{{ s.content }}\" hint-placeholder-val=\"{{ false }}\"><dc-import name=\"OvdcContent\" toast=\"{{ toast }}\" confirm=\"{{ confirm }}\" go=\"{{ go }}\" hint-size=\"100%,900px\"><\u002Fdc-import><\u002Fsc-if>\n      <sc-if value=\"{{ s.users }}\" hint-placeholder-val=\"{{ false }}\"><dc-import name=\"OvdcUsers\" toast=\"{{ toast }}\" confirm=\"{{ confirm }}\" go=\"{{ go }}\" hint-size=\"100%,900px\"><\u002Fdc-import><\u002Fsc-if>\n      <sc-if value=\"{{ s.settings }}\" hint-placeholder-val=\"{{ false }}\"><dc-import name=\"OvdcSettings\" toast=\"{{ toast }}\" confirm=\"{{ confirm }}\" go=\"{{ go }}\" hint-size=\"100%,900px\"><\u002Fdc-import><\u002Fsc-if>\n    <\u002Fmain>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ showMobile }}\" hint-placeholder-val=\"{{ false }}\">\n<div data-screen-label=\"Mobile\" style=\"min-height:100vh;display:flex;align-items:flex-start;justify-content:center;gap:32px;padding:{{ framePad }};background:{{ frameBg }}\">\n  <sc-if value=\"{{ framed }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"width:240px;padding-top:24px;display:flex;flex-direction:column;gap:12px\">\n      <div style=\"font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--color-accent)\">Mobile preview<\u002Fdiv>\n      <div style=\"font-weight:800;font-size:22px;line-height:1.15\">Dashboard and leads on a 390px screen<\u002Fdiv>\n      <p style=\"font-size:13px;color:color-mix(in srgb,var(--color-text) 62%,transparent);margin:0\">Same data and actions as desktop. Sales agents use this view on site.<\u002Fp>\n      <div style=\"display:flex;gap:8px\"><button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ toggleDevice }}\"><ov-icon name=\"monitor\" size=\"16\"><\u002Fov-icon>Desktop<\u002Fbutton><button class=\"btn btn-icon btn-secondary\" sc-camel-on-click=\"{{ toggleTheme }}\" aria-label=\"Toggle theme\"><ov-icon name=\"{{ themeIcon }}\" size=\"16\"><\u002Fov-icon><\u002Fbutton><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n  <div style=\"width:{{ phoneW }};height:{{ phoneH }};flex:none;display:flex;flex-direction:column;background:var(--color-bg);border:{{ phoneBorder }};overflow:hidden;position:relative\">\n    <div style=\"height:52px;flex:none;display:flex;align-items:center;gap:10px;padding:0 12px 0 16px;border-bottom:2px solid var(--color-divider)\">\n      <div style=\"width:18px;height:18px;background:var(--color-accent)\"><\u002Fdiv>\n      <div style=\"font-weight:800;font-size:16px;flex:1\">{{ crumbScreen }}<\u002Fdiv>\n      <button class=\"btn btn-icon\" aria-label=\"Search\"><ov-icon name=\"search\" size=\"18\"><\u002Fov-icon><\u002Fbutton>\n      <button class=\"btn btn-icon\" sc-camel-on-click=\"{{ toggleNotif }}\" aria-label=\"Notifications\" style=\"position:relative\"><ov-icon name=\"bell\" size=\"18\"><\u002Fov-icon><span style=\"position:absolute;top:8px;right:9px;width:7px;height:7px;background:var(--color-accent)\"><\u002Fspan><\u002Fbutton>\n    <\u002Fdiv>\n    <div style=\"flex:1;min-height:0;overflow:auto\">\n      <sc-if value=\"{{ s.dashboard }}\" hint-placeholder-val=\"{{ true }}\"><dc-import name=\"OvdcDashboard\" toast=\"{{ toast }}\" confirm=\"{{ confirm }}\" go=\"{{ go }}\" mobile=\"{{ true }}\" hint-size=\"100%,900px\"><\u002Fdc-import><\u002Fsc-if>\n      <sc-if value=\"{{ s.leads }}\" hint-placeholder-val=\"{{ false }}\"><dc-import name=\"OvdcLeads\" toast=\"{{ toast }}\" confirm=\"{{ confirm }}\" go=\"{{ go }}\" mobile=\"{{ true }}\" hint-size=\"100%,900px\"><\u002Fdc-import><\u002Fsc-if>\n      <sc-if value=\"{{ s.visits }}\" hint-placeholder-val=\"{{ false }}\"><dc-import name=\"OvdcVisits\" toast=\"{{ toast }}\" confirm=\"{{ confirm }}\" go=\"{{ go }}\" mobile=\"{{ true }}\" hint-size=\"100%,900px\"><\u002Fdc-import><\u002Fsc-if>\n      <sc-if value=\"{{ mobileOther }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"padding:16px;display:flex;flex-direction:column\">\n          <div style=\"font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:color-mix(in srgb,var(--color-text) 60%,transparent);padding-bottom:8px;border-bottom:2px solid var(--color-divider)\">All sections<\u002Fdiv>\n          <sc-for list=\"{{ flatNav }}\" as=\"it\" hint-placeholder-count=\"8\">\n            <button sc-camel-on-click=\"{{ it.go }}\" style=\"display:flex;align-items:center;gap:12px;border:0;border-bottom:1px solid var(--color-divider);background:transparent;color:var(--color-text);font:inherit;font-size:15px;padding:0 4px;min-height:52px;text-align:left;cursor:pointer\"><ov-icon name=\"{{ it.icon }}\" size=\"18\"><\u002Fov-icon><span style=\"flex:1\">{{ it.label }}<\u002Fspan><ov-icon name=\"chevron-right\" size=\"16\"><\u002Fov-icon><\u002Fbutton>\n          <\u002Fsc-for>\n          <p style=\"font-size:12px;color:color-mix(in srgb,var(--color-text) 55%,transparent);margin-top:14px\">Inventory, tours and content editing open in the desktop layout.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n    <div style=\"height:64px;flex:none;display:grid;grid-template-columns:repeat(4,1fr);border-top:2px solid var(--color-divider);background:var(--color-bg)\">\n      <sc-for list=\"{{ tabs }}\" as=\"t\" hint-placeholder-count=\"4\">\n        <button sc-camel-on-click=\"{{ t.go }}\" style=\"border:0;background:transparent;font:inherit;font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;color:{{ t.fg }};font-weight:{{ t.fw }};border-top:{{ t.bt }};margin-top:-2px\"><ov-icon name=\"{{ t.icon }}\" size=\"20\"><\u002Fov-icon>{{ t.label }}<\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<div style=\"position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:8px;z-index:100;max-width:calc(100vw - 40px)\">\n  <sc-for list=\"{{ toasts }}\" as=\"t\" hint-placeholder-count=\"0\">\n    <div role=\"status\" style=\"display:flex;align-items:center;gap:12px;min-width:300px;max-width:400px;background:var(--color-text);color:var(--color-bg);padding:12px 12px 12px 14px;box-shadow:var(--shadow-lg);animation:ovToastIn .2s ease-out\">\n      <span style=\"color:{{ t.color }}\"><ov-icon name=\"{{ t.icon }}\" size=\"18\"><\u002Fov-icon><\u002Fspan>\n      <div style=\"flex:1;font-size:13.5px;line-height:1.35\">{{ t.msg }}<\u002Fdiv>\n      <sc-if value=\"{{ t.action }}\" hint-placeholder-val=\"{{ false }}\"><button sc-camel-on-click=\"{{ t.onAction }}\" style=\"border:0;background:transparent;color:var(--color-accent-400);font:inherit;font-weight:800;font-size:13px;cursor:pointer\">{{ t.action }}<\u002Fbutton><\u002Fsc-if>\n      <button sc-camel-on-click=\"{{ t.close }}\" aria-label=\"Dismiss\" style=\"border:0;background:transparent;color:inherit;opacity:.6;cursor:pointer;padding:2px;display:flex\"><ov-icon name=\"x\" size=\"16\"><\u002Fov-icon><\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fsc-for>\n<\u002Fdiv>\n\n<sc-if value=\"{{ modal }}\" hint-placeholder-val=\"{{ false }}\">\n  <div class=\"dialog-backdrop\" sc-camel-on-click=\"{{ closeModal }}\" style=\"z-index:90\">\n    <div class=\"dialog\" role=\"dialog\" sc-camel-on-click=\"{{ stop }}\">\n      <div style=\"display:flex;gap:12px;align-items:flex-start\">\n        <div style=\"width:36px;height:36px;flex:none;display:grid;place-items:center;background:{{ modal.iconBg }};color:{{ modal.iconFg }}\"><ov-icon name=\"{{ modal.icon }}\" size=\"18\"><\u002Fov-icon><\u002Fdiv>\n        <div style=\"flex:1\"><div class=\"dialog-title\">{{ modal.title }}<\u002Fdiv><div class=\"dialog-body\" style=\"margin-top:6px\">{{ modal.body }}<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"dialog-actions\"><button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ closeModal }}\">Cancel<\u002Fbutton><button class=\"btn btn-primary\" sc-camel-on-click=\"{{ modalOk }}\">{{ modal.confirmLabel }}<\u002Fbutton><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;initialScreen&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;login&quot;,&quot;dashboard&quot;,&quot;projects&quot;,&quot;units&quot;,&quot;tours&quot;,&quot;floorplans&quot;,&quot;media&quot;,&quot;leads&quot;,&quot;visits&quot;,&quot;content&quot;,&quot;users&quot;,&quot;settings&quot;],&quot;default&quot;:&quot;dashboard&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;device&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;desktop&quot;,&quot;mobile&quot;],&quot;default&quot;:&quot;desktop&quot;,&quot;tsType&quot;:&quot;string&quot;}}\">\nclass Component extends DCLogic {\n  constructor(p) {\n    super(p);\n    const init = p.initialScreen ?? 'dashboard';\n    this.state = {\n      authed: init !== 'login', authView: 'login', screen: init === 'login' ? 'dashboard' : init,\n      theme: p.theme ?? 'light', device: p.device ?? 'desktop', collapsed: false, notifOpen: false,\n      toasts: [], modal: null, email: 'ananya.rao@ovdc.in', password: '', showPw: false, loginError: '', signing: false,\n      narrow: typeof window !== 'undefined' && window.innerWidth < 760\n    };\n    this.tid = 0;\n  }\n  componentDidMount() { this.onR = () => this.setState({ narrow: window.innerWidth < 760 }); window.addEventListener('resize', this.onR); }\n  componentWillUnmount() { window.removeEventListener('resize', this.onR); }\n  componentDidUpdate(pp) {\n    const p = this.props;\n    if (pp.theme !== p.theme && p.theme) this.setState({ theme: p.theme });\n    if (pp.device !== p.device && p.device) this.setState({ device: p.device });\n    if (pp.initialScreen !== p.initialScreen && p.initialScreen) this.setState(p.initialScreen === 'login' ? { authed: false, authView: 'login' } : { authed: true, screen: p.initialScreen });\n  }\n  toast = (msg, kind = 'success', action, onAction) => {\n    const id = ++this.tid;\n    this.setState(s => ({ toasts: [...s.toasts, { id, msg, kind, action, onAction }].slice(-4) }));\n    setTimeout(() => this.setState(s => ({ toasts: s.toasts.filter(t => t.id !== id) })), 4200);\n  };\n  confirm = (o) => this.setState({ modal: o });\n  go = (screen) => this.setState({ screen, notifOpen: false });\n  renderVals() {\n    const S = this.state;\n    const nav = [\n      { label: 'Overview', items: [['dashboard', 'Dashboard', 'layout-dashboard']] },\n      { label: 'Inventory', items: [['projects', 'Projects', 'building-2'], ['units', 'Units', 'layout-grid'], ['tours', '360° Tours', 'rotate-3d'], ['floorplans', 'Floor plans', 'map'], ['media', 'Media library', 'images']] },\n      { label: 'CRM', items: [['leads', 'Leads', 'inbox', '24'], ['visits', 'Site visits', 'calendar-days']] },\n      { label: 'Website', items: [['content', 'Content', 'file-text']] },\n      { label: 'Admin', items: [['users', 'Users & roles', 'shield-check'], ['settings', 'Settings', 'settings']] }\n    ];\n    let crumbGroup = '', crumbScreen = '';\n    const navGroups = nav.map(g => ({ label: g.label, items: g.items.map(([id, label, icon, badge]) => {\n      const on = S.screen === id; if (on) { crumbGroup = g.label; crumbScreen = label; }\n      return { id, label, icon, badge: badge || null, go: () => this.go(id),\n        bg: on ? 'color-mix(in srgb,var(--color-accent) 11%,transparent)' : 'transparent',\n        fg: on ? 'var(--color-accent-700)' : 'var(--color-text)', fw: on ? 600 : 400 };\n    }) }));\n    const flatNav = navGroups.flatMap(g => g.items);\n    const s = {}; flatNav.forEach(i => s[i.id] = S.screen === i.id);\n    const mobile = S.device === 'mobile' || S.narrow;\n    const mainTabs = ['dashboard', 'leads', 'visits'];\n    const tabDefs = [['dashboard', 'Home', 'layout-dashboard'], ['leads', 'Leads', 'inbox'], ['visits', 'Visits', 'calendar-days'], ['more', 'More', 'menu']];\n    const curTab = mainTabs.includes(S.screen) ? S.screen : 'more';\n    const tabs = tabDefs.map(([id, label, icon]) => ({ label, icon, go: () => this.go(id === 'more' ? 'more' : id),\n      fg: curTab === id ? 'var(--color-accent)' : 'var(--color-text)', fw: curTab === id ? 600 : 400, bt: curTab === id ? '2px solid var(--color-accent)' : '2px solid transparent' }));\n    const framed = S.device === 'mobile' && !S.narrow;\n    const kinds = { success: ['circle-check', '#7FB89A'], info: ['info', 'var(--color-bg)'], error: ['circle-alert', 'var(--color-accent-400)'] };\n    const m = S.modal;\n    return {\n      theme: S.theme, themeIcon: S.theme === 'dark' ? 'sun' : 'moon',\n      showLogin: !S.authed, showDesktop: S.authed && !mobile, showMobile: S.authed && mobile,\n      authLogin: S.authView === 'login', authForgot: S.authView === 'forgot', authSent: S.authView === 'sent',\n      email: S.email, password: S.password, pwType: S.showPw ? 'text' : 'password', pwIcon: S.showPw ? 'eye-off' : 'eye',\n      loginError: S.loginError, signInLabel: S.signing ? 'Signing in…' : 'Sign in',\n      onEmail: e => this.setState({ email: e.target.value }), onPassword: e => this.setState({ password: e.target.value, loginError: '' }),\n      togglePw: () => this.setState({ showPw: !S.showPw }),\n      goForgot: e => { e.preventDefault(); this.setState({ authView: 'forgot' }); }, goLogin: () => this.setState({ authView: 'login' }),\n      sendReset: () => this.setState({ authView: 'sent' }), resend: () => this.toast('Reset link sent again to ' + S.email),\n      signIn: e => { e.preventDefault(); if (S.password.length < 6) return this.setState({ loginError: 'Enter your password (at least 6 characters).' }); this.setState({ signing: true }); setTimeout(() => this.setState({ authed: true, signing: false, password: '' }), 700); },\n      toggleTheme: () => this.setState({ theme: S.theme === 'dark' ? 'light' : 'dark' }),\n      toggleDevice: () => this.setState({ device: S.device === 'mobile' ? 'desktop' : 'mobile', screen: S.device === 'mobile' ? S.screen : (mainTabs.includes(S.screen) ? S.screen : 'dashboard') }),\n      toggleCollapse: () => this.setState({ collapsed: !S.collapsed }), expanded: !S.collapsed, sideW: S.collapsed ? '64px' : '236px',\n      navGroups, flatNav, s, crumbGroup, crumbScreen: crumbScreen || 'More', tabs, mobileOther: S.screen === 'more' || !['dashboard', 'leads', 'visits'].includes(S.screen),\n      framed, framePad: framed ? '32px' : '0', frameBg: framed ? 'var(--color-surface)' : 'var(--color-bg)',\n      phoneW: framed ? '390px' : '100%', phoneH: framed ? '844px' : '100vh', phoneBorder: framed ? '2px solid var(--color-text)' : '0',\n      notifOpen: S.notifOpen, toggleNotif: () => this.setState({ notifOpen: !S.notifOpen }), markRead: () => { this.setState({ notifOpen: false }); this.toast('All notifications marked as read', 'info'); },\n      notifs: [\n        { icon: 'inbox', text: 'New lead: Karthik Menon enquired about Aurum Heights 3 BHK', time: '4 min ago', go: () => this.go('leads') },\n        { icon: 'calendar-check', text: 'Site visit confirmed for Priya Sharma, today 4:30 PM', time: '38 min ago', go: () => this.go('visits') },\n        { icon: 'rotate-3d', text: 'Tour \"Meridian Park — 2 BHK Type B\" published by Rahul', time: '2 h ago', go: () => this.go('tours') }\n      ],\n      askSignOut: () => this.confirm({ title: 'Sign out of OVDC Admin?', body: 'Unsaved changes in open forms will be lost.', confirmLabel: 'Sign out', icon: 'log-out', onConfirm: () => this.setState({ authed: false, authView: 'login' }) }),\n      toast: this.toast, confirm: this.confirm, go: this.go,\n      toasts: S.toasts.map(t => ({ ...t, icon: kinds[t.kind][0], color: kinds[t.kind][1], action: t.action || null,\n        onAction: () => { t.onAction && t.onAction(); this.setState(s => ({ toasts: s.toasts.filter(x => x.id !== t.id) })); },\n        close: () => this.setState(s => ({ toasts: s.toasts.filter(x => x.id !== t.id) })) })),\n      modal: m ? { title: m.title, body: m.body, confirmLabel: m.confirmLabel || 'Confirm', icon: m.icon || (m.danger ? 'triangle-alert' : 'circle-help'),\n        iconBg: m.danger ? 'var(--color-accent-100)' : 'var(--color-neutral-200)', iconFg: m.danger ? 'var(--color-accent-700)' : 'var(--color-text)' } : null,\n      closeModal: () => this.setState({ modal: null }), stop: e => e.stopPropagation(),\n      modalOk: () => { const f = m && m.onConfirm; this.setState({ modal: null }); f && f(); }\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
